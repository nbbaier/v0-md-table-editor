<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    /* Base Style: Black Box, No Border */
    .box { fill: #1a1a1a; }
    
    /* Dark Mode Only: Add White Border so it doesn't disappear */
    @media (prefers-color-scheme: dark) {
      .box { stroke: #ffffff; stroke-width: 20px; }
    }
  </style>

  <!-- The Box -->
  <rect class="box" x="10" y="10" width="492" height="492" rx="128" />

  <!-- The Letter -->
  <!-- Changed dy from "25" to "10" to shift it UP slightly -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" 
        font-family="Libre Baskerville, Georgia, serif" font-weight="800" 
        font-size="340" fill="#ffffff" dy="10">T</text>
</svg>
